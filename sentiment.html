<div class="row">

    <!-- Area Chart for Entities By Year (left) -->
    <div class="col-lg-5">
        <div class="card shadow mb-4">
            <!-- Card Header - Dropdown -->
            <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
                <h6 class="m-0 font-weight-bold text-primary">Entities By Year</h6>
            </div>
            <!-- Card Body -->
            <div class="card-body">
                <div id="entitiesByYear"></div>
            </div>
        </div>
    </div>

    <!-- Vertical Cards (center) -->
    <div class="col-lg-2 d-flex flex-column justify-content-around">
        <!-- Negative Articles Card (swapped position) -->
        <div class="card shadow mb-4" style="border-radius: 15px; background-color: #f8d7da;">
            <div class="card-body d-flex flex-column align-items-center text-center" style="height: 150px;">
                <div class="icon-circle bg-danger mb-3">
                    <i class="fas fa-2x fa-frown text-white"></i>
                </div>
                <div class="text-xs font-weight-bold text-danger text-uppercase mb-1">Negative Articles</div>
                <div class="h5 mb-0 font-weight-bold text-dark" id="negativeArticlesCount"></div>
            </div>
        </div>

        <!-- Neutral Articles Card -->
        <div class="card shadow mb-4" style="border-radius: 15px; background-color: #fff3cd;">
            <div class="card-body d-flex flex-column align-items-center text-center" style="height: 150px;">
                <div class="icon-circle bg-secondary mb-3">
                    <i class="fas fa-2x fa-meh text-white"></i>
                </div>
                <div class="text-xs font-weight-bold text-secondary text-uppercase mb-1">Neutral Articles</div>
                <div class="h5 mb-0 font-weight-bold text-dark" id="neutralArticlesCount"></div>
            </div>
        </div>

        <!-- Positive Articles Card (swapped position) -->
        <div class="card shadow mb-4" style="border-radius: 15px; background-color: #d4edda;">
            <div class="card-body d-flex flex-column align-items-center text-center" style="height: 150px;">
                <div class="icon-circle bg-success mb-3">
                    <i class="fas fa-2x fa-smile text-white"></i>
                </div>
                <div class="text-xs font-weight-bold text-success text-uppercase mb-1">Positive Articles</div>
                <div class="h5 mb-0 font-weight-bold text-dark" id="positiveArticlesCount"></div>
            </div>
        </div>
    </div>

    <!-- Pie Chart for Articles Grouped By Entity And Sentiment (right) -->
    <div class="col-lg-5">
        <div class="card shadow mb-4">
            <!-- Card Header - Dropdown -->
            <div class="card-header py-3 d-flex flex-row align-items-center justify-content-between">
                <h6 class="m-0 font-weight-bold text-primary">Articles Grouped By Entity And Sentiment</h6>
            </div>
            <!-- Card Body -->
            <div class="card-body">
                <div id="articlesGroupedByEntityAndSentiment"></div>
            </div>
        </div>
    </div>

</div>
